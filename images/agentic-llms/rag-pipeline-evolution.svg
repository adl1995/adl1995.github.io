<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="100%" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-Warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="860" height="360" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Naive RAG Section -->
  <text x="24" y="32" font-size="13" font-weight="700" fill="#334155" letter-spacing="0.5">1. NAIVE RAG (SINGLE-PASS)</text>
  
  <rect x="24" y="46" width="130" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="89" y="69" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">User Question</text>
  <text x="89" y="86" font-size="10" fill="#64748b" text-anchor="middle">Raw text query</text>

  <line x1="154" y1="72" x2="204" y2="72" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="204" y="46" width="160" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="284" y="69" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Vector Search (Top-k)</text>
  <text x="284" y="86" font-size="10" fill="#64748b" text-anchor="middle">Find similar chunks</text>

  <line x1="364" y1="72" x2="414" y2="72" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="414" y="46" width="160" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="494" y="69" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Build Prompt</text>
  <text x="494" y="86" font-size="10" fill="#64748b" text-anchor="middle">Paste chunks + question</text>

  <line x1="574" y1="72" x2="624" y2="72" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="624" y="46" width="140" height="52" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="694" y="69" font-size="12" font-weight="600" fill="#991b1b" text-anchor="middle">LLM Answer</text>
  <text x="694" y="86" font-size="10" fill="#b91c1c" text-anchor="middle">Can miss clues or scope</text>

  <line x1="24" y1="122" x2="836" y2="122" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Modular RAG Section -->
  <text x="24" y="150" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.5">2. MODULAR RAG PIPELINE</text>

  <!-- Stage 1: Pre-Retrieval -->
  <rect x="24" y="168" width="185" height="114" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="116" y="190" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">1. Improve Query</text>
  <text x="116" y="214" font-size="11" fill="#1e3a8a" text-anchor="middle">• Intent Classifier &amp; Router</text>
  <text x="116" y="234" font-size="11" fill="#1e3a8a" text-anchor="middle">• Query Rewriting</text>
  <text x="116" y="254" font-size="11" fill="#1e3a8a" text-anchor="middle">• HyDE (Hypothetical Doc)</text>

  <line x1="209" y1="225" x2="241" y2="225" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Search -->
  <rect x="241" y="168" width="175" height="114" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="328" y="190" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">2. Targeted Search</text>
  <text x="328" y="214" font-size="11" fill="#14532d" text-anchor="middle">• Search chosen collection</text>
  <text x="328" y="234" font-size="11" fill="#14532d" text-anchor="middle">  (Docs vs. Support Cases)</text>
  <text x="328" y="254" font-size="11" fill="#14532d" text-anchor="middle">• Fetch candidate pool</text>

  <line x1="416" y1="225" x2="448" y2="225" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: Post-Retrieval -->
  <rect x="448" y="168" width="185" height="114" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="540" y="190" font-size="12" font-weight="700" fill="#6b21a8" text-anchor="middle">3. Filter &amp; Compress</text>
  <text x="540" y="214" font-size="11" fill="#581c87" text-anchor="middle">• Rerank best matches</text>
  <text x="540" y="234" font-size="11" fill="#581c87" text-anchor="middle">• Remove duplicates (MMR)</text>
  <text x="540" y="254" font-size="11" fill="#581c87" text-anchor="middle">• Compress long chunks</text>

  <line x1="633" y1="225" x2="665" y2="225" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: Verification & Generation -->
  <rect x="665" y="168" width="171" height="114" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="750" y="190" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">4. Check &amp; Answer</text>
  <text x="750" y="214" font-size="11" fill="#78350f" text-anchor="middle">• Verify evidence is enough</text>
  <text x="750" y="234" font-size="11" fill="#78350f" text-anchor="middle">• Generate cited answer</text>
  <text x="750" y="254" font-size="11" fill="#78350f" text-anchor="middle">• Say if info is missing</text>

  <!-- Corrective Loop -->
  <path d="M 750 282 L 750 324 L 328 324 L 328 286" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-Warn)"/>
  <rect x="430" y="311" width="225" height="24" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="542" y="327" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="middle">Missing info? → Retry with targeted search</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="100%" height="100%" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="860" height="320" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left Panel: Iterative Tool Loop -->
  <text x="24" y="32" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.5">A. ITERATIVE AGENTIC RETRIEVAL LOOP</text>

  <rect x="28" y="54" width="360" height="54" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="208" y="76" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Reasoning &amp; Hypothesis Check (LLM)</text>
  <text x="208" y="94" font-size="10.5" fill="#1e3a8a" text-anchor="middle">Evaluates current evidence gaps &amp; competing causes</text>

  <path d="M 270 108 L 270 152" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="330" y="134" font-size="10.5" fill="#1d4ed8" text-anchor="middle">1. Select tool &amp; query</text>

  <rect x="28" y="154" width="360" height="58" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="208" y="177" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Retrieval Tools (Enforced Call Budget)</text>
  <text x="208" y="196" font-size="11" font-family="monospace" fill="#475569" text-anchor="middle">search_sources(query)  |  read_source(file)</text>

  <path d="M 146 154 L 146 110" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="82" y="134" font-size="10.5" fill="#475569" text-anchor="middle">2. New clues (ERR-LEASE)</text>

  <rect x="28" y="236" width="360" height="56" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="208" y="259" font-size="11.5" font-weight="600" fill="#166534" text-anchor="middle">Example Multi-Hop Trace</text>
  <text x="208" y="277" font-size="10.5" fill="#14532d" text-anchor="middle">Read case-021.md → Discovers ERR-LEASE &amp; RUN-RENEW →</text>
  <text x="208" y="290" font-size="10.5" fill="#14532d" text-anchor="middle">Searches error catalog &amp; renewal policy → Synthesizes timeline</text>

  <line x1="422" y1="24" x2="422" y2="296" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Right Panel: Coordinator & Specialists -->
  <text x="448" y="32" font-size="13" font-weight="700" fill="#0f172a" letter-spacing="0.5">B. COORDINATOR &amp; SPECIALIST AGENTS</text>

  <rect x="524" y="54" width="230" height="54" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="639" y="76" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Coordinator Agent</text>
  <text x="639" y="94" font-size="10.5" fill="#1e3a8a" text-anchor="middle">Decomposes problem &amp; verifies citations</text>

  <line x1="580" y1="108" x2="530" y2="162" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="698" y1="108" x2="748" y2="162" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="446" y="164" width="182" height="76" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="537" y="186" font-size="11.5" font-weight="700" fill="#6b21a8" text-anchor="middle">Incidents Specialist</text>
  <text x="537" y="204" font-size="10" fill="#581c87" text-anchor="middle">Attempt logs, error codes,</text>
  <text x="537" y="218" font-size="10" fill="#581c87" text-anchor="middle">outage &amp; restart timelines</text>
  <text x="537" y="232" font-size="9.5" font-family="monospace" fill="#6b21a8" text-anchor="middle">[Isolated context]</text>

  <rect x="652" y="164" width="182" height="76" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="743" y="186" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">Policies Specialist</text>
  <text x="743" y="204" font-size="10" fill="#78350f" text-anchor="middle">Queue overrides, effective</text>
  <text x="743" y="218" font-size="10" fill="#78350f" text-anchor="middle">lease duration &amp; retry rules</text>
  <text x="743" y="232" font-size="9.5" font-family="monospace" fill="#92400e" text-anchor="middle">[Isolated context]</text>

  <rect x="446" y="256" width="388" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="640" y="278" font-size="11" fill="#334155" text-anchor="middle">Findings + cited source filenames return to Coordinator for final answer</text>
</svg>

